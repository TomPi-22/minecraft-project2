# Github actions for automated deployment
# Triggers launch on push
# Runs terraform and ansible

name: Deploy Minecraft Server

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gather and set AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Terraform
        run: terraform init

      - name: Terraform Formatting check
        working-directory: Terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Terraform
        run: terraform validate

      - name: Terraform Destroy
        working-directory: Terraform
        run: terraform destroy -auto-approve -var="key_pair_name=minecraft_server"
        continue-on-error: true

      - name: Terraform Apply
        working-directory: Terraform
        run: terraform apply -auto-approve -var="key_pair_name=minecraft_server"

      - name: Get the Public IP of the server
        id: get_ip
        working-directory: Terraform
        run: echo "server_pub_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

      - name: Get private key from SSM
        run: |
          aws ssm get-parameter \
            --name "/minecraft/private-key" \
            --with-decryption \
            --query Parameter.Value \
            --output text > minecraft_server.pem
          chmod 400 minecraft_server.pem

      - name: Add server IP to inventory file (hosts.ini)
        run: |
          sed -i 's|\${server_pub_ip}|${{ steps.get_ip.outputs.server_pub_ip }}|g' Ansible/hosts.ini

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible playbook (playbook.yaml)
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook -i Ansible/hosts.ini Ansible/playbook.yml --private-key minecraft_server.pem
