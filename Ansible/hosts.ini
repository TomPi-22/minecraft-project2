# Inventory file for the server
# server_pub_ip is the Minecraft servers public IP
# It will be automatically created upon deployment

[minecraft]
minecraft_server ansible_host=${server_pub_ip}

# Variables applied to parent above
[minecraft:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=minecraft_server.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
