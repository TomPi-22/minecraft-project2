# Ansible playbook for server configuration
# Installs docker, deploys the container, and establishes systemd service

---
- name: Configure Minecraft server
  hosts: minecraft
  become: true
  tasks:

    - name: Install aptitude
      ansible.builtin.apt:
        name: aptitude
        state: latest
        update_cache: true

    - name: Install required system packages
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - gnupg
          - python3-pip
        state: latest
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: De-armor Docker GPG key for APT
      ansible.builtin.command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install Docker module for Python
      ansible.builtin.pip:
        name: docker

    - name: Pull Docker image from Docker directory
      community.docker.docker_image:
        name: itzg/minecraft-server
        source: pull

    - name: Create Minecraft directory
      ansible.builtin.file:
        path: /minecraft
        state: directory
        mode: '0755'

    - name: Copy compose.yaml to the server
      ansible.builtin.copy:
        src: ../docker/compose.yaml
        dest: /minecraft/compose.yaml
        mode: '0644'

    - name: Copy systemd file
      ansible.builtin.template:
        src: minecraft-service.txt
        dest: /etc/systemd/system/minecraft.service
        mode: '0644'

    - name: Launch Minecraft service
      ansible.builtin.systemd_service:
        name: minecraft
        state: started
        enabled: true
        daemon_reload: true
