# Docker config sourced from the official Minecraft wiki
# itzg/minecraft-server handles server setup and auto-config
# Restart functionality to make sure restart after reboot works

services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
    volumes:
      - ./data:/data
    restart: unless-stopped
